<!-- Adding a New Student-->
{% extends "base.html" %}

{% block content %}

<h2>Add a Student</h2>

<form method = "POST" action = "{{ url_for('add_student') }}" class = "grade-form">

        <div class="form-group">
            <label for = "first_name">First Name:</label>
            <input type = "text" id = "ffirstname" name = "ffirstname" placeholder = "First Name" required/>
            <label for = "pref_name">Preferred Name:</label>
            <input type = "text" id = "fprefname" name = "fprefname" placeholder = "Preferred Name"/>
            <label for = "last_name">Last Name:</label>
            <input type = "text" id = "flastname" name = "flastname" placeholder = "Last Name" required/>
            <br />
        </div>

        <div class = "form-actions">
            <button type = "submit">Add Student</button>
            <a href = "{{ url_for('students') }}">Cancel</a>
        </div>
    </form>

{% endblock %}
