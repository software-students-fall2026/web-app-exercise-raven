{% extends "base.html" %}

{% block content %}
    <h1>Class Grades</h1>

    <table border="1">
        <tr>
            <th>Student</th>
            <th>Grade</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.grade }}</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
